name: Godot CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: firebelley/godot-export@v5
        with:
          godot-version: 4.5.1
          cache: true

      - name: Run headless test
        run: |
          godot --headless --quit --path .
