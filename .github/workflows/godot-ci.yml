name: Godot CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false

      - name: Verify Godot installed
        run: godot --version

      - name: Validate autoload scripts and naming
        run: python3 .github/scripts/check_autoload_usage.py

      - name: Validate GDScript syntax (excluding addons)
        run: python3 .github/scripts/check_gdscript_syntax.py

      - name: Validate scene and resource references (.tscn/.tres)
        run: python3 .github/scripts/check_scene_resources.py

      - name: Validate scene signal connections
        run: python3 .github/scripts/check_scene_connections.py

      - name: Lint basic GDScript style
        run: python3 .github/scripts/check_gdscript_style.py

      - name: Report potentially unused assets (non-blocking)
        run: python3 .github/scripts/check_unused_assets.py

      - name: Run headless smoke test
        run: godot --headless --quit --path .
