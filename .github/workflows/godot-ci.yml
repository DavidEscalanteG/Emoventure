name: Godot CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Lint workflows (YAML + actionlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          config_file: .github/workflows/.yamllint.yml

      - name: Lint GitHub Actions workflow syntax
        uses: rhysd/actionlint@v1

  gdscript-check:
    name: GDScript syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false

      - name: Verify Godot installation
        run: godot --version

      - name: Check syntax of all .gd files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(git ls-files '*.gd' -z)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No GDScript files found."
            exit 0
          fi

          for script in "${scripts[@]}"; do
            echo "Checking ${script}"
            godot --headless --path . --check-only --script "$script"
          done

  smoke-test:
    name: Headless project smoke test
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - gdscript-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false

      - name: Verify Godot installation
        run: godot --version

      - name: Run headless smoke test
        run: godot --headless --path . --quit
